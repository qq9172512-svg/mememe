          <div>
            <label>民法概要 (0-100分)</label>
            <input type="number" id="calc-civil" value="55" style="width: 100%; padding: 0.6rem; margin-top: 0.4rem; border-radius: 8px; background: #0f172a; color: #fff; border: 1px solid var(--border-color);">
          </div>
          <div>
            <label>不動產經紀相關法規 (0-100分)</label>
            <input type="number" id="calc-broker" value="80" style="width: 100%; padding: 0.6rem; margin-top: 0.4rem; border-radius: 8px; background: #0f172a; color: #fff; border: 1px solid var(--border-color);">
          </div>
          <div>
            <label>國文 (作文兩題, 0-100分)</label>
            <input type="number" id="calc-chinese" value="55" style="width: 100%; padding: 0.6rem; margin-top: 0.4rem; border-radius: 8px; background: #0f172a; color: #fff; border: 1px solid var(--border-color);">
          </div>
        </div>
        <button class="btn-primary" onclick="calculateExamScore()">試算國考加權總成績</button>
        <div id="calc-result-box" style="margin-top: 1.5rem; padding: 1.2rem; border-radius: 12px; background: rgba(15,23,42,0.8); border: 1px solid var(--accent-blue); display: none;">
          <h3 id="calc-score-val" style="color: var(--accent-amber); font-size: 1.6rem;">國考加權總分：0 分</h3>
          <p id="calc-pass-status" style="margin-top: 0.5rem; font-size: 1.1rem; font-weight: 600;"></p>
        </div>
      </div>
      <!-- 歷次模擬考歷史紀錄表 -->
      <div class="glass-panel">
        <div class="panel-title">
          <span>📜</span>
          <span>歷次模擬考歷史紀錄</span>
        </div>
        <div id="history-table-container">
          <!-- 歷次紀錄動態渲染 -->
        </div>
      </div>
    </section>
  </main>
  <!-- 數據載入 -->
  <script src="../data/flashcards.js"></script>
  <script src="../data/questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
