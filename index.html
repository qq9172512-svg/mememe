<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學習管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Header & Account Switcher Bar -->
        <header class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-graduation-cap text-indigo-600"></i>
                    學習管理系統
                </h1>
                <p class="text-xs text-slate-500 mt-1">學員進度追蹤與學習歷程記錄</p>
            </div>

            <!-- 學員切換區與同步狀態 -->
            <div class="flex flex-wrap items-center gap-3 bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                <div class="flex items-center gap-2">
                    <label for="studentSelect" class="text-xs font-semibold text-slate-600 whitespace-nowrap">
                        <i class="fa-solid fa-user-graduate text-indigo-500 mr-1"></i>切換學員：
                    </label>
                    <select id="studentSelect" onchange="switchStudent()" class="bg-white text-sm font-medium text-slate-700 border border-slate-300 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <!-- JS 動態渲染學員 -->
                    </select>
                </div>

                <div class="h-4 w-px bg-slate-300 hidden sm:block"></div>

                <!-- 登入與同步狀態按鈕區 (放在切換學員旁邊) -->
                <div class="flex items-center gap-2">
                    <button id="syncBtn" onclick="triggerSync()" class="inline-flex items-center gap-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-medium px-3 py-1.5 rounded-md border border-indigo-200 transition">
                        <i id="syncIcon" class="fa-solid fa-rotate text-indigo-600"></i>
                        <span id="syncStatus">登入同步中</span>
                    </button>
                    <span id="lastSyncTime" class="text-[11px] text-slate-400">剛才已更新</span>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="grid grid-[#grid-template-columns] md:grid-cols-3 gap-6">
            
            <!-- Left Panel: 學員資訊 & 快速紀錄 -->
            <div class="md:col-span-1 space-y-6">
                <!-- 學員基本資料卡 -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">目前選取學員</h2>
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 font-bold text-lg flex items-center justify-center" id="studentAvatar">
                            --
                        </div>
                        <div>
                            <div class="text-lg font-bold text-slate-800" id="studentName">讀取中...</div>
                            <div class="text-xs text-slate-500" id="studentId">ID: --</div>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 grid grid-cols-2 gap-2 text-center text-xs">
                        <div class="bg-slate-50 p-2 rounded">
                            <div class="text-slate-400">累計學習日誌</div>
                            <div class="text-base font-bold text-slate-700" id="logCount">0</div>
                        </div>
                        <div class="bg-slate-50 p-2 rounded">
                            <div class="text-slate-400">同步狀態</div>
                            <div class="text-base font-bold text-emerald-600" id="accountSyncText">已同步</div>
                        </div>
                    </div>
                </div>

                <!-- 新增日誌表單 -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                    <h3 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-indigo-500"></i>
                        新增學習記錄
                    </h3>
                    <form id="logForm" onsubmit="handleAddLog(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">主題 / 單元</label>
                            <input type="text" id="logTopic" required placeholder="例如：主題一 基礎概念" class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">學習內容與心得</label>
                            <textarea id="logContent" rows="3" required placeholder="請輸入今日學習成果或筆記..." class="w-full text-sm border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-2 px-4 rounded-md shadow transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-plus"></i> 新增記錄
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Panel: 學習日誌 Timeline Log -->
            <div class="md:col-span-2">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 min-h-[500px]">
                    <div class="flex items-center justify-between pb-4 border-b border-slate-200 mb-4">
                        <div>
                            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-book-bookmark text-indigo-500"></i>
                                學習日誌
                            </h2>
                            <p class="text-xs text-slate-400 mt-0.5">顯示目前學員的所有歷史學習軌跡（即時儲存於本機與雲端）</p>
                        </div>
                        <button onclick="clearCurrentLogs()" class="text-xs text-rose-500 hover:text-rose-700 flex items-center gap-1 font-medium px-2 py-1 hover:bg-rose-50 rounded transition">
                            <i class="fa-solid fa-trash-can"></i> 清空當前日誌
                        </button>
                    </div>

                    <!-- 學習日誌列表 -->
                    <div id="logsTimeline" class="space-y-4">
                        <!-- JS 動態生成 -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // Version 控制機制，確保快取更新
        const STORAGE_KEY_VERSION = 'broker_initial_state_v6';
        const STORAGE_KEY_LOGS = 'broker_append_only_log';

        // 預設學員資料
        const students = [
            { id: 'ST001', name: '王小明' },
            { id: 'ST002', name: '李美玲' },
            { id: 'ST003', name: '張立偉' }
        ];

        let currentStudentId = students[0].id;
        let logsData = {};

        // 初始化與強制 reset 控制
        function initApp() {
            // 清理舊版版本快取
            if (!localStorage.getItem(STORAGE_KEY_VERSION)) {
                localStorage.removeItem(STORAGE_KEY_LOGS);
                localStorage.setItem(STORAGE_KEY_VERSION, 'initialized');
            }

            // 載入 localStorage 資料
            const savedLogs = localStorage.getItem(STORAGE_KEY_LOGS);
            if (savedLogs) {
                try {
                    logsData = JSON.parse(savedLogs);
                } catch (e) {
                    logsData = {};
                }
            } else {
                logsData = {};
            }

            // 確保所有學員都有陣列容器
            students.forEach(s => {
                if (!logsData[s.id]) {
                    logsData[s.id] = [];
                }
            });

            renderStudentSelect();
            updateStudentDisplay();
            renderLogs();
        }

        // 渲染學員選單
        function renderStudentSelect() {
            const selectEl = document.getElementById('studentSelect');
            selectEl.innerHTML = students.map(s => 
                `<option value="${s.id}" ${s.id === currentStudentId ? 'selected' : ''}>${s.name} (${s.id})</option>`
            ).join('');
        }

        // 切換學員
        function switchStudent() {
            const selectEl = document.getElementById('studentSelect');
            currentStudentId = selectEl.value;
            updateStudentDisplay();
            renderLogs();
            triggerSync(true); // 自動發起登入同步
        }

        // 更新 UI 上學員基本資訊
        function updateStudentDisplay() {
            const currentStudent = students.find(s => s.id === currentStudentId);
            if (currentStudent) {
                document.getElementById('studentName').innerText = currentStudent.name;
                document.getElementById('studentId').innerText = 'ID: ' + currentStudent.id;
                document.getElementById('studentAvatar').innerText = currentStudent.name.substring(0, 1);
            }
        }

        // 渲染學習日誌
        function renderLogs() {
            const container = document.getElementById('logsTimeline');
            const studentLogs = logsData[currentStudentId] || [];
            
            document.getElementById('logCount').innerText = studentLogs.length;

            if (studentLogs.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-400">
                        <i class="fa-regular fa-folder-open text-4xl mb-3 block text-slate-300"></i>
                        <p class="text-sm font-medium">目前尚無學習日誌記錄</p>
                        <p class="text-xs text-slate-400 mt-1">可透過左側表單新增第一筆學習記錄</p>
                    </div>
                `;
                return;
            }

            // 按時間倒序顯示
            const sortedLogs = [...studentLogs].reverse();
            container.innerHTML = sortedLogs.map((log, idx) => `
                <div class="p-4 rounded-lg bg-slate-50 border border-slate-200 transition hover:border-indigo-300">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold px-2 py-0.5 rounded bg-indigo-100 text-indigo-700">
                            ${escapeHtml(log.topic)}
                        </span>
                        <span class="text-xs text-slate-400">
                            <i class="fa-regular fa-clock mr-1"></i>${log.timestamp}
                        </span>
                    </div>
                    <p class="text-sm text-slate-700 whitespace-pre-line leading-relaxed">${escapeHtml(log.content)}</p>
                </div>
            `).join('');
        }

        // 新增日誌處理
        function handleAddLog(event) {
            event.preventDefault();
            const topic = document.getElementById('logTopic').value.trim();
            const content = document.getElementById('logContent').value.trim();

            if (!topic || !content) return;

            const newLog = {
                id: 'log_' + Date.now(),
                topic: topic,
                content: content,
                timestamp: new Date().toLocaleString('zh-TW', { hour12: false })
            };

            if (!logsData[currentStudentId]) {
                logsData[currentStudentId] = [];
            }

            logsData[currentStudentId].push(newLog);
            saveLogsToStorage();

            // 重設表單
            document.getElementById('logTopic').value = '';
            document.getElementById('logContent').value = '';

            renderLogs();
        }

        // 清空目前學員的學習日誌
        function clearCurrentLogs() {
            if (confirm('確定要清空該位學員的所有學習日誌嗎？此操作無法復原。')) {
                logsData[currentStudentId] = [];
                saveLogsToStorage();
                renderLogs();
            }
        }

        // 儲存至 localStorage
        function saveLogsToStorage() {
            localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(logsData));
        }

        // 觸發登入同步效果
        function triggerSync(auto = false) {
            const icon = document.getElementById('syncIcon');
            const statusText = document.getElementById('syncStatus');
            const timeText = document.getElementById('lastSyncTime');
            const accountSyncText = document.getElementById('accountSyncText');

            icon.classList.add('fa-spin');
            statusText.innerText = '同步中...';
            accountSyncText.innerText = '同步中';
            accountSyncText.className = 'text-base font-bold text-amber-500';

            setTimeout(() => {
                icon.classList.remove('fa-spin');
                statusText.innerText = '登入同步中';
                accountSyncText.innerText = '已同步';
                accountSyncText.className = 'text-base font-bold text-emerald-600';
                
                const now = new Date();
                const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                timeText.innerText = `上次同步 ${timeStr}`;
            }, 800);
        }

        // HTML 轉義防範 XSS
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // 頁面載入完成後初始化
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
